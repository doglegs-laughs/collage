appId: com.collage.app
productName: Collage
directories:
  output: release
  buildResources: build
files:
  - electron/**/*
  - dist/renderer/**/*
  - package.json
asar: true
publish: null
asarUnpack: []
mac:
  category: public.app-category.photography
  icon: build/icon.png
  identity: null
  target:
    - target: dir
      arch: [arm64]
  extraResources:
    - from: resources/ffmpeg/darwin-${arch}/ffmpeg
      to: ffmpeg/ffmpeg
