appId: com.collage.app
productName: Collage
directories:
  output: release
  buildResources: build
files:
  - electron/**/*
  - dist/renderer/**/*
  - package.json
asar: true
# Disable the Node.js escape hatches in the packaged Electron binary. Embedded asar integrity validation is left off.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
publish: null
asarUnpack: []
mac:
  category: public.app-category.photography
  icon: build/icon.png
  identity: null
  target:
    - target: dir
      arch: [arm64]
  extraResources:
    - from: resources/ffmpeg/darwin-${arch}/ffmpeg
      to: ffmpeg/ffmpeg
win:
  icon: build/icon.png
  # Applies to the zip; nsis sets its own name below.
  artifactName: Collage-win-x64.${ext}
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  extraResources:
    # npm ci on a Windows runner installs the matching ffmpeg-static binary
    - from: node_modules/ffmpeg-static/ffmpeg.exe
      to: ffmpeg/ffmpeg.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Collage-Setup-x64.${ext}
