<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c7ff7"/>
      <stop offset="1" stop-color="#5b3fd6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd59e"/>
      <stop offset="1" stop-color="#ff9a7a"/>
    </linearGradient>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3ff"/>
      <stop offset="1" stop-color="#8cc4f2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1e1065" flood-opacity=".38"/>
    </filter>
    <filter id="outer" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824px body inset 100px -->
  <g filter="url(#outer)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  </g>

  <!-- back print -->
  <g transform="rotate(-11 512 512)" filter="url(#shadow)">
    <rect x="262" y="258" width="420" height="500" rx="14" fill="#f4f2ff"/>
    <rect x="292" y="288" width="360" height="380" rx="4" fill="url(#sky2)"/>
    <path d="M292 600 L400 500 L470 560 L560 470 L652 560 L652 668 L292 668 Z" fill="#4f9a7a"/>
  </g>

  <!-- front print: white border with thick bottom band -->
  <g transform="rotate(7 540 540)" filter="url(#shadow)">
    <rect x="330" y="290" width="440" height="520" rx="14" fill="#ffffff"/>
    <rect x="362" y="322" width="376" height="380" rx="4" fill="url(#sky)"/>
    <circle cx="640" cy="420" r="44" fill="#fff6e0"/>
    <path d="M362 620 L470 520 L540 580 L620 500 L738 610 L738 702 L362 702 Z" fill="#6b4fd8"/>
    <path d="M362 660 L450 600 L540 650 L640 590 L738 650 L738 702 L362 702 Z" fill="#3d2a9c"/>
  </g>
</svg>
