name: Build apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Documentation-only changes (README, docs/, other Markdown) skip the builds. A skipped job counts as passing
  # for required checks, so such pull requests can still merge. Anything else, or an unknown base, builds.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
            if [ -n "$files" ] && ! grep -qvE '^(docs/.*|[^/]*\.md)$' <<<"$files"; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Builds needed: $code"

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node -e "require('electron')"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - run: xvfb-run -a npm run e2e

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Electron fetches its binary lazily on first require; do it once here, not from parallel tests.
      - run: node -e "require('electron')"
      # Unit tests probe rendered videos with ffprobe
      - run: brew install ffmpeg
      - run: npm run typecheck
      - run: npm test

      - name: Build and ad-hoc sign Collage.app
        run: npm run dist:mac

      - name: Verify signature
        run: codesign --verify --deep --strict --verbose=2 release/mac-arm64/Collage.app

      # The fuses must be set, and the hardened app must still start: the userData folder only gets the
      # app's own name once its packaged code has loaded.
      - name: Check fuses and that the packaged app starts
        run: |
          npx --no-install electron-fuses read --app release/mac-arm64/Collage.app | tee fuses.txt
          grep -q "RunAsNode is Disabled" fuses.txt
          grep -q "OnlyLoadAppFromAsar is Enabled" fuses.txt
          release/mac-arm64/Collage.app/Contents/MacOS/Collage & pid=$!
          sleep 20
          kill -0 $pid
          kill $pid
          test -d "$HOME/Library/Application Support/Collage"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Collage-mac-arm64
          path: release/Collage-mac-arm64.zip
          if-no-files-found: error


  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # Unit tests run on the macOS job; this job only builds the Windows app.

      - name: Build Windows installer and zip
        run: |
          npm run build
          npx electron-builder --win --x64

      - name: Check that the packaged app starts
        shell: pwsh
        run: |
          $p = Start-Process release/win-unpacked/Collage.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "Collage exited with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          if (-not (Test-Path "$env:APPDATA/Collage")) { throw "Collage did not start its app code" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Collage-windows-x64
          path: |
            release/Collage-Setup-x64.exe
            release/Collage-win-x64.zip
          if-no-files-found: error

  # Publishes a GitHub Release for the version in package.json once both builds pass on main.
  # A version that already has a release is skipped, so later pushes never replace published files.
  release:
    needs: [e2e, build, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Create release if this version has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "Collage $version" --generate-notes \
            artifacts/Collage-mac-arm64/Collage-mac-arm64.zip \
            artifacts/Collage-windows-x64/Collage-Setup-x64.exe \
            artifacts/Collage-windows-x64/Collage-win-x64.zip
