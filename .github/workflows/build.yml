name: Build apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14   # Apple Silicon
    permissions:
      contents: write   # needed to attach the zip to a release on tag pushes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Unit tests probe rendered videos with ffprobe
      - run: brew install ffmpeg
      - run: npm run typecheck
      - run: npm test

      - name: Build and ad-hoc sign Collage.app
        run: npm run dist:mac

      - name: Verify signature
        run: codesign --verify --deep --strict --verbose=2 release/mac-arm64/Collage.app

      - uses: actions/upload-artifact@v4
        with:
          name: Collage-mac-arm64
          path: release/Collage-mac-arm64.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes 2>/dev/null || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" release/Collage-mac-arm64.zip --clobber

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # Unit tests run on the macOS job; this job only builds the Windows app.

      - name: Build Windows installer and zip
        run: |
          npm run build
          npx electron-builder --win --x64

      - uses: actions/upload-artifact@v4
        with:
          name: Collage-windows-x64
          path: |
            release/Collage-Setup-*-x64.exe
            release/Collage-win-x64.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes 2>/dev/null || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" release/Collage-Setup-*-x64.exe release/Collage-win-x64.zip --clobber
