name: Build Mac app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14   # Apple Silicon
    permissions:
      contents: write   # needed to attach the zip to a release on tag pushes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build and ad-hoc sign Collage.app
        run: npm run dist:mac

      - name: Verify signature
        run: codesign --verify --deep --strict --verbose=2 release/mac-arm64/Collage.app

      - uses: actions/upload-artifact@v4
        with:
          name: Collage-mac-arm64
          path: release/Collage-mac-arm64.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/Collage-mac-arm64.zip --clobber
